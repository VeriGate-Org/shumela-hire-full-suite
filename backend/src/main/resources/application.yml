server:
  port: 8080

spring:
  application:
    name: shumelahire-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  refresh-expiration: 604800000

# Encryption
encryption:
  key: ${ENCRYPTION_KEY:}

# Storage
storage:
  provider: ${STORAGE_PROVIDER:local}

# S3 Configuration (used when storage.provider=s3)
s3:
  bucket: ${S3_BUCKET:shumelahire-documents}
  region: ${S3_REGION:af-south-1}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}

# E-Signature
# 'local'    — simulated provider, no credentials needed, signatures are NOT legally binding
# 'docusign' — real provider; deployed environments resolve the credentials below from
#              the DocuSign secret (DOCUSIGN_SECRET_ARN), not from these defaults
esignature:
  provider: ${ESIGNATURE_PROVIDER:local}

# DocuSign Configuration (only read when esignature.provider=docusign)
docusign:
  base-url: ${DOCUSIGN_BASE_URL:https://demo.docusign.net/restapi}
  account-id: ${DOCUSIGN_ACCOUNT_ID:}
  integration-key: ${DOCUSIGN_INTEGRATION_KEY:}
  secret-key: ${DOCUSIGN_SECRET_KEY:}
  user-id: ${DOCUSIGN_USER_ID:}
  webhook-hmac-key: ${DOCUSIGN_WEBHOOK_HMAC_KEY:}
  private-key: ${DOCUSIGN_PRIVATE_KEY:}
  auth-server: ${DOCUSIGN_AUTH_SERVER:https://account-d.docusign.com}

# Data Residency
data-residency:
  region: ${DATA_RESIDENCY_REGION:ZA}
  provider: ${DATA_RESIDENCY_PROVIDER:local}
  compliance-standard: POPIA

# File Upload
app:
  file:
    upload-dir: ${UPLOAD_DIR:uploads}

# AI Configuration
ai:
  enabled: ${AI_ENABLED:false}
  # mock | bedrock | claude | openai
  # bedrock authenticates by IAM and needs no key — preferred. Model ids must be
  # cross-region inference profiles (global.anthropic.*): af-south-1 rejects bare model ids.
  provider: ${AI_PROVIDER:mock}
  bedrock:
    model: ${BEDROCK_MODEL:global.anthropic.claude-sonnet-4-5-20250929-v1:0}
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: ${CLAUDE_MODEL:claude-sonnet-4-20250514}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}

# Job Board Configuration
# Each board has an `enabled` flag for its live API connector and a `mode`.
# mode=simulated runs the board against an in-process sandbox provider
# (SimulatedJobBoardConnector) that exercises the full publish/sync/takedown
# path without credentials — the same idea as a payment provider's test mode.
# Default is `live`, so nothing simulates unless an environment says so, and a
# board with no key falls through to a manual posting as before.
# Do not set both `enabled: true` and `mode: simulated` for the same board.
#
# `simulated-tenants` is the second switch, and both must agree. A deployment
# is shared, so simulating a board for a demonstration tenant must not hand a
# different, paying tenant a posting that claims to be live and is not — every
# tenant not named here keeps the manual-posting behaviour. Empty simulates for
# nobody, whatever the board modes say.
job-boards:
  simulated-tenants: ${JOB_BOARD_SIMULATED_TENANTS:}
  linkedin:
    enabled: ${LINKEDIN_ENABLED:false}
    mode: ${LINKEDIN_MODE:live}
    api-key: ${LINKEDIN_API_KEY:}
    api-secret: ${LINKEDIN_API_SECRET:}
    org-id: ${LINKEDIN_ORG_ID:}
  indeed:
    enabled: ${INDEED_ENABLED:false}
    mode: ${INDEED_MODE:live}
    employer-id: ${INDEED_EMPLOYER_ID:}
    api-token: ${INDEED_API_TOKEN:}
  pnet:
    enabled: ${PNET_ENABLED:false}
    mode: ${PNET_MODE:live}
    api-key: ${PNET_API_KEY:}
  career-junction:
    enabled: ${CAREER_JUNCTION_ENABLED:false}
    mode: ${CAREER_JUNCTION_MODE:live}
    api-key: ${CAREER_JUNCTION_API_KEY:}
    partner-id: ${CAREER_JUNCTION_PARTNER_ID:}

# LinkedIn Social Posting (company page)
linkedin:
  social:
    enabled: ${LINKEDIN_SOCIAL_ENABLED:false}
    client-id: ${LINKEDIN_SOCIAL_CLIENT_ID:}
    client-secret: ${LINKEDIN_SOCIAL_CLIENT_SECRET:}
    redirect-uri: ${LINKEDIN_SOCIAL_REDIRECT_URI:http://localhost:8080/api/linkedin/social/auth/callback}

# Background Check / Verification
background-check:
  provider: ${BACKGROUND_CHECK_PROVIDER:dots-africa}

# Dots Africa Verification (NCR-accredited — NCRCB38)
dots-africa:
  base-url: ${DOTS_AFRICA_BASE_URL:https://api.dotsafrica.com/v1}
  api-key: ${DOTS_AFRICA_API_KEY:}
  client-id: ${DOTS_AFRICA_CLIENT_ID:}

# SAP Payroll Integration
sap:
  payroll:
    enabled: ${SAP_PAYROLL_ENABLED:false}
    base-url: ${SAP_PAYROLL_BASE_URL:}
    client-id: ${SAP_PAYROLL_CLIENT_ID:}
    client-secret: ${SAP_PAYROLL_CLIENT_SECRET:}
    auth-url: ${SAP_PAYROLL_AUTH_URL:}
    company-code: ${SAP_PAYROLL_COMPANY_CODE:}
    payroll-area: ${SAP_PAYROLL_PAYROLL_AREA:}

# Notification Configuration
notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
  sqs:
    enabled: ${NOTIFICATION_SQS_ENABLED:false}
    queue-url: ${SQS_NOTIFICATION_QUEUE_URL:}

# AWS SES Email
ses:
  enabled: ${SES_ENABLED:false}
  region: ${SES_REGION:af-south-1}
  from-email: ${SES_FROM_EMAIL:noreply@shumelahire.co.za}
  from-name: ${SES_FROM_NAME:ShumelaHire}

# Microsoft Graph (Teams + Outlook)
microsoft:
  enabled: ${MICROSOFT_ENABLED:false}
  tenant-id: ${MICROSOFT_TENANT_ID:}
  client-id: ${MICROSOFT_CLIENT_ID:}
  client-secret: ${MICROSOFT_CLIENT_SECRET:}
  teams:
    webhook-url: ${TEAMS_WEBHOOK_URL:}
  outlook:
    calendar-user: ${OUTLOOK_CALENDAR_USER:}

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Leave Management
leave:
  carry-forward:
    cron: "0 0 1 1 1 ?"
  encashment:
    enabled: ${LEAVE_ENCASHMENT_ENABLED:true}

# Sage Integration
sage:
  300-people:
    enabled: ${SAGE_300_ENABLED:true}
  evolution:
    enabled: ${SAGE_EVOLUTION_ENABLED:true}

# Talent pool retention
#
# How long a candidate stays in a talent pool after last contact, per POPIA s14. There is no
# default: talent-pool-months is 0 (unset), which means retainUntil is never stamped, nothing is
# ever eligible, and no entry is ever deleted. Choosing the number is a decision for the client —
# see docs/TALENT-POOL-RETENTION-DECISION.md — and a purge running on an invented period would
# destroy candidate history irreversibly.
#
# Roll out in this order: set the months, run the preview, enable the scheduler with purging still
# off for a full notice cycle, then enable purging.
shumelahire:
  retention:
    talent-pool-months: ${TALENT_POOL_RETENTION_MONTHS:0}
    talent-pool-notice-days: ${TALENT_POOL_RETENTION_NOTICE_DAYS:30}
    talent-pool-purge-enabled: ${TALENT_POOL_PURGE_ENABLED:false}

talent-pool:
  retention:
    scheduler:
      enabled: ${TALENT_POOL_RETENTION_SCHEDULER_ENABLED:false}
